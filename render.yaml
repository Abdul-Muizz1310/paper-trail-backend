services:
  - type: web
    name: paper_trail
    runtime: docker
    plan: free
    # /health always answers 200 and reports the DB verdict in its `db` field, so
    # this gate checks "the process is up and serving", not "the DB is reachable".
    # Deliberate: a transient Neon blip should not make Render tear the instance
    # down and restart it. Reachability is asserted by CI's post-deploy `smoke`
    # job, which fails when /health reports db != "ok".
    healthCheckPath: /health
    # No preDeployCommand: the free plan never runs one. The container's
    # entrypoint (docker-entrypoint.sh) runs `alembic upgrade head` on every
    # boot instead; a no-op at head, and a failure aborts the boot.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        sync: false
      - key: OPENROUTER_MODEL_PRIMARY
        sync: false
      - key: OPENROUTER_MODEL_FAST
        sync: false
      - key: OPENROUTER_MODEL_FALLBACK
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      # Upstash-backed rate limiting for the paid debate endpoints.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Platform contract v2 (docs/specs/10-platform-contract-v2.md): bastion's
      # public key (base64 SPKI DER). With neither this nor the frontend key set,
      # every protected route answers 503 (fail closed).
      - key: BASTION_SIGNING_KEY_PUBLIC
        sync: false
      # paper-trail-frontend's own Ed25519 public key (base64 SPKI DER); never opens /platform/debate.
      - key: PAPER_TRAIL_FRONTEND_SIGNING_KEY_PUBLIC
        sync: false
      # Ed25519 private key (PEM) that signs transcript receipts. Publish the
      # matching public key at /platform/receipt-public-key.
      - key: TRANSCRIPT_SIGNING_KEY
        sync: false
      # Shared bearer secret gating the Prometheus /metrics endpoint (SEC-1).
      - key: METRICS_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://paper-trail-backend-jjpf.onrender.com"
      - key: CORS_ORIGINS
        value: "https://paper-trail-frontend-sable.vercel.app,http://localhost:3000"
      # Default false in code. true only tolerates a *missing* token during a
      # rollout; a present token is always verified. Never hardcode "true".
      - key: DEMO_MODE
        sync: false
      - key: PORT
        value: "8000"
