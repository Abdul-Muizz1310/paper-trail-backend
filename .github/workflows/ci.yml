name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -m "not slow and not integration and not smoke"

  # The fast tier above runs on in-memory SQLite, which cannot reproduce the
  # cross-session visibility bug that once shipped behind a 99% coverage badge.
  # tests/integration/ pins that behaviour against a real Postgres via
  # Testcontainers — it only gates anything if CI actually executes it.
  integration:
    needs: lint
    runs-on: ubuntu-latest # ubuntu runners ship a working Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      # --no-cov: pyproject addopts inject --cov-fail-under=80, and this tier
      # exercises a narrow slice on purpose. Coverage is gated by the fast job.
      - run: uv run pytest -m integration --no-cov

  eval:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      # Ship-gate smoke check: the deterministic dry-run (no LLM, no network)
      # runs on every push so the eval harness itself can't silently rot. The
      # real-mode >=80% accuracy gate is run manually against OpenRouter before
      # tagging a release.
      - run: uv run python -m evals.run_eval --dry-run --report-path /tmp/eval-dry-run.md

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ github.repository }}:${{ github.sha }} .

  # Post-deploy gate. Render auto-deploys main on push, so this runs after the
  # image builds and probes the live host. Env-gated: with the
  # PAPER_TRAIL_BASE_URL secret unset (or the service parked) the tier SKIPS
  # instead of failing, so hosting state can never redden an unrelated commit.
  smoke:
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - name: post-deploy smoke (skips when PAPER_TRAIL_BASE_URL is unset)
        env:
          PAPER_TRAIL_BASE_URL: ${{ secrets.PAPER_TRAIL_BASE_URL }}
        run: uv run pytest -m smoke --no-cov -rs
