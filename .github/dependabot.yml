version: 2
updates:
  # Keep the workflow action versions current (checkout, setup-uv, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Python dependencies are resolved and pinned by uv.lock, so Dependabot has to
  # speak `uv` (not bare pip) to update the lockfile alongside pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
