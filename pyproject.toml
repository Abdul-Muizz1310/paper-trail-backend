[project]
name = "paper_trail"
version = "0.1.0"
description = "LangGraph multi-agent debate service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "sse-starlette>=2.2",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "langfuse>=2.55",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "upstash-redis>=1.2",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
]
# Intentionally NOT declared: voyageai, pgvector, python-jose, tavily-python and
# tenacity were all listed here but imported nowhere in src/. Tavily is called
# over raw httpx, and pgvector's extension is created by raw SQL in
# alembic/versions/0001, which needs no Python package.
# Verified in the built image: voyageai, pgvector, tavily and jose are now
# absent from production (python-jose in particular carried its own CVE
# surface). tenacity still ships, but transitively via langchain-core rather
# than as our own direct dependency — the point is that nothing here claims a
# capability the code does not use.
# Re-add any of them in the same commit as its first real import.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_trail"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paper_trail"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "langfuse.*",
    "upstash_redis.*",
    "prometheus_fastapi_instrumentator.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: slow end-to-end tests (CI-only)",
    "integration: requires Testcontainers / real Postgres",
    "smoke: probes a live deployment; skips unless SMOKE_BASE_URL is set",
]

